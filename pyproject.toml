[project]
name = "kingspan-connect-sensor"
version = "5.0.0"
description = "API to get oil tank from Kingspan SENSiT sensors"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
authors = [
  {name = "Jon Connell", email = "python@figsandfudge.com"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "httpx>=0.28",
  "lxml>=6.0.2",
  "requests>=2.28.1,<3.0.0",
  "zeep>=4.3.2",
]

[project.urls]
Documentation = "https://github.com/masaccio/kingspan-connect-sensor/blob/main/README.md"
Repository = "https://github.com/masaccio/kingspan-connect-sensor"

[project.scripts]
kingspan-status = "connectsensor._kingspan_status:main"

[dependency-groups]
dev = [
  "aiofiles>=22.1.0",
  "openpyxl>=3.0.10",
  "pytest>=7.1.0",
  "pytest-asyncio>=0.20.2",
  "pytest-console-scripts>=1.3.1",
  "pytest-cov>=3.0.0",
  "pytest-socket>=0.7.0",
  "ruff>=0.7.1",
  "tox>=4.23.2",
  "mypy>=1.14.1",
  "pytest-mock>=3.14.0",
  "pytest-xdist<4.0.0,>=3.3.1",
  "pre-commit>=4.6.2",
  "pylint>=4.1.3",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"kingspan_connect_sensor" = ["py.typed"]

[tool.coverage.run]
branch = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.pytest.ini_options]
addopts = "-W ignore::DeprecationWarning -q -n logical --disable-socket --allow-unix-socket --cov-report=html --cov-report=term-missing:skip-covered --cov=connectsensor"
minversion = 6.0
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "tests"]

[tool.tox]
requires = ["tox>=4.0"]
env_list = ["py311", "py312", "py313", "py314", "py315"]

[tool.tox.env_run_base]
deps = [
  "aiofiles>=22.1.0",
  "pytest>=7.1.0",
  "pytest-asyncio>=0.20.2",
  "pytest-console-scripts>=1.3.1",
  "pytest-cov>=3.0.0",
  "pytest-mock>=3.14.0",
  "pytest-socket>=0.7.0",
  "pytest-xdist<4.0.0,>=3.3.1",
]
commands = [
  ["pytest", "tests/", "--import-mode", "importlib", "-n", "logical", "--disable-socket", "--no-cov"]
]

[tool.ruff]
exclude = [
  "**/.tox/*",
  "**/.vscode/*",
]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001",   # Missing copyright notice at top of file
  # Conflicts with other rules
  "D212",     # Multiline summary first line
  "D203",     # Blank lines before class docstrings
  "D416",     # Colon after after section titles
]

[tool.ruff.lint.pylint]
max-statements = 100
max-branches = 20

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.ruff.lint.per-file-ignores]
"src/connectsensor/_kingspan_status.py" = [
  "T201",     # Allow print()
]
"tests/**" = [
  "ARG001",   # Fixtures not always referenced
  "ANN401",   # Allow Any for **kwargs
  "C901",     # Allow complex test functions
  "DTZ001",   # Numbers stores data in UTC
  "PLR2004",  # Magic values allowed
  "PLR0911",  # Allow complexity (many return statements)
  "PTH118",   # os.path.join() should be replaced by Path.joinpath()
  "PTH118",   # os.path.join() should be replaced by Path with / operator
  "PTH123",   # open() should be replaced by Path.open()
  "S101",     # Allow assert in tests
  "SLF001",   # Tests need to access internal data for coverage
  ]

