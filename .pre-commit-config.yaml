repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        entry: uv run --active ruff check
        args: [--config, pyproject.toml, --fix]
        files: ^(src/connectsensor/|tests/)

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        entry: uv run --active pylint
        args: [--rcfile, pyproject.toml]
        files: ^(src/connectsensor/|tests/)
        additional_dependencies:
          [async-property, asyncio, datetime, httpx, lxml, requests, zeep]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        entry: uv run --active mypy
        args: [--config-file, pyproject.toml, --strict]
        files: ^(src/connectsensor/|tests/)
        additional_dependencies:
          [
            types-aiofiles,
            async-property,
            asyncio,
            datetime,
            httpx,
            lxml,
            requests,
            zeep,
          ]

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        entry: uv run --active --with pyright pyright
        args: [--project, pyproject.toml]
        files: ^(src/connectsensor/|tests/)
        additional_dependencies:
          [async-property, asyncio, datetime, httpx, lxml, requests, zeep]
